location = /service360 { return 302 /service360/; }
location ^~ /service360/api/ {
    proxy_pass http://127.0.0.1:4200/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
}
location = /service360/mobile { return 302 /service360/mobile/; }
location ^~ /service360/mobile/ {
    root /opt/service360/current/public;
    try_files $uri $uri/ /service360/mobile/index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "no-cache";
}
location ^~ /service360/ {
    root /opt/service360/current/public;
    try_files $uri $uri/ /service360/index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "no-cache";
}
